# Local-dev-only SASL/PLAIN client config for the `diagnostic-agent-ro` principal —
# the SAME identity the diagnostic agent and mcp-confluent authenticate as. Matches
# the KAFKA_AGENT_SASL_PASSWORD default in .env.example. Used only by
# scripts/demo-denied.sh and tests/test_denied_mutations.py to prove, from outside
# the application code, that this identity's mutations are rejected by the broker.
security.protocol=SASL_PLAINTEXT
sasl.mechanism=PLAIN
sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="diagnostic-agent-ro" password="agent-secret";
