# Local-dev-only SASL/PLAIN client config for the `admin` (super user) principal.
# Matches the KAFKA_ADMIN_SASL_PASSWORD default in .env.example — regenerate this
# file if you change that password. Used by kafka-acl-init, kafka-init, the
# broker's own healthcheck, and any kafka-*.sh CLI invocation run as admin.
security.protocol=SASL_PLAINTEXT
sasl.mechanism=PLAIN
sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-secret";
